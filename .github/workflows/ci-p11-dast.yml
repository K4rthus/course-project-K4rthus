name: P11 - DAST Scan

on:
  workflow_dispatch:
  push:
    branches: [ "main", "p11-dast-zap" ]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - '.github/workflows/ci-p11-dast.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi==0.120.1 uvicorn==0.38.0 pydantic==2.5.0

      - name: Create evidence directory
        run: mkdir -p EVIDENCE/P11

      - name: Run the application (FastAPI)
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 --access-log &
          APP_PID=$!
          echo "App started with PID: $APP_PID"
          echo $APP_PID > app.pid
          sleep 5
          echo "Checking if port 8000 is listening..."
          ss -tulpn | grep :8000 || echo "Port 8000 not found"
          echo "Waiting for /health endpoint..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "Application is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Application failed to start after 30 seconds"
              exit 1
            fi
            sleep 1
            echo -n "."
          done

      - name: Create minimal ZAP config
        run: |
          cat > zap-baseline.conf << EOF
          rules.10054 = 90000
          rules.10055 = 90000
          EOF

      - name: Verify app is reachable
        run: |
          echo "Testing application endpoints..."
          curl -v http://localhost:8000/health
          echo ""
          curl -v http://localhost:8000/suggestions
          echo ""

      - name: Run OWASP ZAP Baseline Scan
        run: |
          echo "Starting ZAP baseline scan..."

          echo -e "10054\t90000\n10055\t90000" > zap-baseline.conf

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8000 \
            -r /zap/wrk/zap_baseline.html \
            -J /zap/wrk/zap_baseline.json \
            -c /zap/wrk/zap-baseline.conf \
            -d -I

          echo "ZAP scan completed"
          if [ -f zap_baseline.html ] && [ -f zap_baseline.json ]; then
            echo "Moving reports to EVIDENCE/P11/"
            mv zap_baseline.html zap_baseline.json EVIDENCE/P11/
            echo "Files in EVIDENCE/P11/:"
            ls -la EVIDENCE/P11/
          else
            echo "ERROR: ZAP reports not generated!"
            echo "Checking what files exist..."
            ls -la zap_baseline.* 2>/dev/null || echo "No ZAP report files"
            exit 1
          fi

      - name: Stop the application
        if: always()
        run: |
          if [ -f app.pid ]; then
            echo "Stopping application (PID: $(cat app.pid))"
            kill $(cat app.pid) 2>/dev/null || true
            rm -f app.pid
          fi

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11/
          retention-days: 30

      - name: Check evidence contents
        if: always()
        run: |
          echo "Final check of EVIDENCE/P11/"
          ls -la EVIDENCE/P11/ || echo "Directory does not exist"
          if [ -f EVIDENCE/P11/zap_baseline.html ]; then
            echo "ZAP HTML report exists"
          else
            echo "ZAP HTML report missing"
          fi
