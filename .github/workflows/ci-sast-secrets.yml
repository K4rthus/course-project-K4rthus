name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    branches: ["main", "p10-sast-secrets"]
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.md"
      - "security/semgrep/**"
      - "security/.gitleaks.toml"
      - ".github/workflows/ci-sast-secrets.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "**/*.md"
      - "security/semgrep/**"
      - "security/.gitleaks.toml"
      - ".github/workflows/ci-sast-secrets.yml"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P10

      - name: Semgrep CI (SARIF)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -w /src \
            returntocorp/semgrep:v1.144.0 \
            semgrep ci \
              --config "p/ci" \
              --config "/src/security/semgrep/rules.yml" \
              --sarif \
              --output "/src/EVIDENCE/P10/semgrep.sarif" \
              --metrics=off \
              --no-rewrite-rule-ids \
              || echo "Semgrep completed with findings"

      - name: Gitleaks detect
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/repo \
            -w /repo \
            zricethezav/gitleaks:v8.30.0 \
            detect \
              --no-banner \
              --config="/repo/security/.gitleaks.toml" \
              --source="/repo" \
              --report-format=json \
              --report-path="/repo/EVIDENCE/P10/gitleaks.json" \
              --verbose \
              || echo "Gitleaks completed with findings"

      - name: Generate SAST & Secrets summary
        run: |
          echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_secrets_summary.md
          echo "**Generated:** $(date -u)" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "**Commit:** ${{ github.sha }}" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "" >> EVIDENCE/P10/sast_secrets_summary.md

          echo "## Semgrep Findings" >> EVIDENCE/P10/sast_secrets_summary.md
          if [ -f "EVIDENCE/P10/semgrep.sarif" ]; then
            SEMGREP_COUNT=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
            echo "- **Total findings:** $SEMGREP_COUNT" >> EVIDENCE/P10/sast_secrets_summary.md

            echo "- **By severity:**" >> EVIDENCE/P10/sast_secrets_summary.md
            jq -r '.runs[0].results[].level // "warning" | select(. != null)' EVIDENCE/P10/semgrep.sarif 2>/dev/null | \
              sort | uniq -c | while read count level; do
                echo "  - $level: $count" >> EVIDENCE/P10/sast_secrets_summary.md
              done || echo "  - No severity data available" >> EVIDENCE/P10/sast_secrets_summary.md
          else
            echo "- No Semgrep report generated" >> EVIDENCE/P10/sast_secrets_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "## Gitleaks Findings" >> EVIDENCE/P10/sast_secrets_summary.md
          if [ -f "EVIDENCE/P10/gitleaks.json" ]; then
            GITLEAKS_COUNT=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
            echo "- **Total findings:** $GITLEAKS_COUNT" >> EVIDENCE/P10/sast_secrets_summary.md

            if [ "$GITLEAKS_COUNT" -gt 0 ]; then
              echo "- **Sample findings:**" >> EVIDENCE/P10/sast_secrets_summary.md
              jq -r '.[0:3][] | "  - \(.Description) in \(.File):\(.StartLine)"' EVIDENCE/P10/gitleaks.json 2>/dev/null >> EVIDENCE/P10/sast_secrets_summary.md || true
            fi
          else
            echo "- No Gitleaks report generated" >> EVIDENCE/P10/sast_secrets_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "## Triage Notes & Action Plan" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "1. **Semgrep findings:**" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "   - Review all high/critical severity findings" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "   - Check for false positives in custom rules" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "   - Create issues for legitimate security concerns" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "2. **Gitleaks findings:**" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "   - Verify if any real secrets were exposed" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "   - Rotate any compromised credentials immediately" >> EVIDENCE/P10/sast_secrets_summary.md
          echo "   - Add legitimate false positives to allowlist" >> EVIDENCE/P10/sast_secrets_summary.md

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: EVIDENCE/P10/semgrep.sarif

      - name: Upload SAST & Secrets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P10_EVIDENCE
          path: EVIDENCE/P10/
          retention-days: 30
