name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles("requirements*.txt", "pyproject.toml") }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run linting
        run: |
          ruff check --output-format=github .
          black --check .
          isort --check-only .

      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest -v \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-report=html:reports/htmlcov-${{ matrix.python-version }}

          echo "Generated test reports:"
          ls -la reports/

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}-${{ matrix.os }}
          path: reports/
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    env:
      SCAN_AGGRESSION: ${{ secrets.SCAN_AGGRESSION || 'normal' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Run security checks
        run: |
          mkdir -p reports
          echo "Running security scans with aggression level: $SCAN_AGGRESSION"

          bandit -r app/ -f json -o reports/bandit-report.json || echo "Bandit scan completed"
          pip-audit --format json --output reports/pip-audit-report.json || echo "pip-audit scan completed"

          if [ ! -f reports/bandit-report.json ]; then
            echo '{"results": []}' > reports/bandit-report.json
          fi
          if [ ! -f reports/pip-audit-report.json ]; then
            echo '{"vulnerabilities": []}' > reports/pip-audit-report.json
          fi

          echo "Security reports created:"
          ls -la reports/*.json

      - name: Generate HTML security report
        run: |
          echo '<!DOCTYPE html><html><head><title>Security Report</title><style>body{font-family: Arial; margin: 40px;}</style></head><body>' > reports/security-report.html
          echo '<h1>Security Scan Summary</h1>' >> reports/security-report.html
          echo '<p>Generated: $(date)</p>' >> reports/security-report.html
          echo '<p>Scan Level: $SCAN_AGGRESSION</p>' >> reports/security-report.html
          echo '<h2>Bandit Findings</h2><pre>' >> reports/security-report.html
          cat reports/bandit-report.json | python3 -m json.tool | head -100 >> reports/security-report.html
          echo '</pre><h2>Dependency Vulnerabilities</h2><pre>' >> reports/security-report.html
          cat reports/pip-audit-report.json | python3 -m json.tool | head -100 >> reports/security-report.html
          echo '</pre></body></html>' >> reports/security-report.html

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          retention-days: 30

  deploy-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, security-scan]
    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'staging' || 'test' }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL || 'ghcr.io/${{ github.repository_owner }}' }}
      APP_NAME: "suggestion-box"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log deployment context
        run: |
          echo "Starting deployment emulation"
          echo "Environment: $DEPLOY_ENV"
          echo "Registry: $DOCKER_REGISTRY"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Using secret for registry: ${{ secrets.DOCKER_REGISTRY_URL != '' && 'SET' || 'NOT SET' }}"

      - name: Build Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          IMAGE_NAME="$DOCKER_REGISTRY/$APP_NAME:$IMAGE_TAG"

          echo "Building Docker image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME --target runtime .

          # Сохраняем образ в tar-файл для артефакта
          docker save $IMAGE_NAME -o $APP_NAME-image.tar

          echo "Image built and saved as $APP_NAME-image.tar"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ env.APP_NAME }}-${{ github.sha }}
          path: ${{ env.APP_NAME }}-image.tar
          retention-days: 7

      - name: Emulate promotion to staging
        if: github.ref == 'refs/heads/main'
        run: |
          echo "All checks passed! Promoting build ${{ github.sha }} to STAGING..."
          echo "Simulating upload to registry: $DOCKER_REGISTRY/$APP_NAME:${{ github.sha }}"
          echo "Registry auth: ${{ secrets.DOCKER_REGISTRY_TOKEN != '' && '***TOKEN_SET***' || 'NO_TOKEN' }}"
          echo "Next steps would be:"
          echo "   1. Push image to $DOCKER_REGISTRY"
          echo "   2. Update Kubernetes deployment in 'staging' namespace"
          echo "   3. Run smoke tests"
          echo "   4. If successful, promote to production"

      - name: Emulate test deployment
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deployment emulation for PR/Test environment: $DEPLOY_ENV"
          echo "Image: $APP_NAME:${{ github.sha }}"
          echo "This is a test run for PR validation."
          echo "Would deploy to Kubernetes namespace: 'test-${{ github.event.pull_request.number }}'"
          echo "Configuration would use:"
          echo "   - Database: ${{ secrets.TEST_DB_URL != '' && '***DB_URL_SET***' || 'NO_DB_CONFIG' }}"
          echo "   - API Keys: ${{ secrets.TEST_API_KEY != '' && '***API_KEY_SET***' || 'NO_API_KEY' }}"

      - name: Create deployment log
        run: |
          echo "=== Deployment Log ===" > deployment.log
          echo "Date: $(date)" >> deployment.log
          echo "Environment: $DEPLOY_ENV" >> deployment.log
          echo "Commit SHA: ${{ github.sha }}" >> deployment.log
          echo "Image: $DOCKER_REGISTRY/$APP_NAME:${{ github.sha }}" >> deployment.log
          echo "Triggered by: ${{ github.actor }}" >> deployment.log
          echo "Workflow: ${{ github.workflow }}" >> deployment.log
          echo "" >> deployment.log
          echo "=== Steps Executed ===" >> deployment.log
          echo "1. Code checkout" >> deployment.log
          echo "2. Docker build" >> deployment.log
          echo "3. Image saved as artifact" >> deployment.log
          echo "4. Deployment emulation completed" >> deployment.log

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-emulation-${{ env.DEPLOY_ENV }}
          path: |
            deployment.log
            Dockerfile
            reports/coverage-*.xml
          retention-days: 7
