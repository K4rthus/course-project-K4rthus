name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pre-commit
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run linting
      run: |
        ruff check --output-format=github .
        black --check .
        isort --check-only .

    - name: Run tests with coverage
      run: |
        mkdir -p reports
        pytest -v

    - name: Run pre-commit
      run: pre-commit run --all-files

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.python-version }}-${{ matrix.os }}
        path: |
          reports/junit-*.xml
          reports/coverage-*.xml
        retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security checks
      run: |
        echo "Running security scans..."
        bandit -r app/ -f json -o reports/bandit-report.json || true
        pip-audit --format json --output reports/pip-audit-report.json || true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: reports/*.json
        retention-days: 30

  deploy-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Dry-run deployment
      run: |
        echo "Starting deployment dry-run..."
        echo "Environment: ${{ github.ref_name }}"
        echo "Repository: ${{ github.repository }}"
        echo "SHA: ${{ github.sha }}"

        # Эмуляция подготовки к деплою
        echo "Building application package..."
        docker build -t suggestion-box:latest --target runtime .

        echo "Deployment dry-run completed successfully!"
        echo "Next steps: Push to registry, deploy to Kubernetes, etc."

    - name: Upload deployment artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-dry-run
        path: Dockerfile
        retention-days: 7
