name: Container Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  container-security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Hadolint
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile
        failure-threshold: warning

    - name: Build Docker image
      run: |
        docker build -t suggestion-box:latest .

    - name: Test container security
      run: |
        docker build -t suggestion-box-test .
        docker run -d --name test-app -p 8000:8000 suggestion-box-test

        echo "Waiting for application to start..."
        sleep 15

        user_id=$(docker exec test-app id -u)
        if [ "$user_id" -eq 0 ]; then
          echo "Container is running as root"
          exit 1
        else
          echo "Container running as user ID: $user_id"
        fi

        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
        if [ "$response" -eq 200 ]; then
          echo "Health endpoint responded with 200"
        else
          echo "Health endpoint failed: HTTP $response"
          exit 1
        fi

        docker stop test-app
        docker rm test-app

    - name: Check image size and layers
      run: |
        echo "=== Image Size ==="
        docker images suggestion-box --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
        echo ""
        echo "=== Image Layers ==="
        docker history suggestion-box:latest
